<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 470 150" width="470" height="150" role="img" aria-label="ELO — Soluções Logísticas Integradas">
  <defs>
    <linearGradient id="elo-ring" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2f6fb0"/>
      <stop offset="0.5" stop-color="#6fb7e6"/>
      <stop offset="1" stop-color="#1b3f63"/>
    </linearGradient>
    <linearGradient id="elo-text" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#eaf3fb"/>
      <stop offset="1" stop-color="#bcd6ea"/>
    </linearGradient>
  </defs>

  <!-- Símbolo: elos entrelaçados -->
  <g transform="translate(14,18)">
    <circle cx="57" cy="57" r="52" fill="none" stroke="url(#elo-ring)" stroke-width="13"/>
    <path d="M57 10
             a47 47 0 0 1 0 94
             a30 30 0 0 0 0 -60
             a17 17 0 0 1 0 -34 Z"
          fill="url(#elo-ring)" opacity="0.92"/>
    <circle cx="57" cy="40" r="11" fill="#eaf3fb" opacity="0.9"/>
  </g>

  <!-- Wordmark ELO -->
  <text x="150" y="86" font-family="'Arial Black', Arial, sans-serif" font-weight="800"
        font-size="74" letter-spacing="2" fill="url(#elo-text)">ELO</text>
  <!-- marca registrada -->
  <text x="372" y="44" font-family="Arial, sans-serif" font-size="16" fill="#cfe2f1">®</text>

  <!-- Tagline -->
  <text x="152" y="116" font-family="Arial, sans-serif" font-weight="600"
        font-size="13" letter-spacing="1.8" fill="#d7e6f2">SOLUÇÕES LOGÍSTICAS INTEGRADAS</text>
</svg>
